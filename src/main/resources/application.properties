# Application
spring.application.name=ecomm
spring.config.import=optional:file:.env[.properties]

# External services
groq.api-key=${GROQ_API_KEY}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/productcatalogservicetest
spring.datasource.username=productcatalogservicetest_user

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
