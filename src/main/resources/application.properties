# Application
spring.application.name=ecomm
spring.config.import=optional:file:.env[.properties]

# External services
groq.api-key=${GROQ_API_KEY}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
groq.url=${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/productcatalogservicetest
spring.datasource.username=productcatalogservicetest_user

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# timeout for HTTP call to external services
# connect-timeout = max time to establish a TCP connection
spring.http.clients.connect-timeout=2s

# read-timeout = max time to wait for data to arrive after connecting
spring.http.clients.read-timeout=5s

# circuit breaker for Groq calls
# Loot at the last 5 calls(once at least 5 calls have happened): if >= 50% fail, trip OPEN for 15s,
# then enter HALF-OPEN and test with 3 calls
resilience4j.circuitbreaker.instances.groq.sliding-window-size=5
resilience4j.circuitbreaker.instances.groq.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.groq.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groq.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.groq.permitted-number-of-calls-in-half-open-state=3
management.endpoints.web.exposure.include=health,circuitbreakers