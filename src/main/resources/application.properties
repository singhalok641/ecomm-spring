# Application
spring.application.name=ecomm
spring.config.import=optional:file:.env[.properties]

# External services
groq.api-key=${GROQ_API_KEY}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/productcatalogservicetest
spring.datasource.username=productcatalogservicetest_user

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# timeout for HTTP call to external services
# connect-timeout = max time to establish a TCP connection
spring.http.clients.connect-timeout=2s

# read-timeout = max time to wait for data to arrive after connecting
spring.http.clients.read-timeout=5s
