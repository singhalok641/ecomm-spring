name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # EcommApplicationTests and ProductSearchIntegrationTest are @SpringBootTest classes that need a live
      # MySQL (productcatalogservice / productcatalogservice_test), so they only run locally or in a job
      # that provisions a database service.
      - name: Run the tests that need no database
        run: ./mvnw -B test -Dtest='!EcommApplicationTests,!ProductSearchIntegrationTest'
